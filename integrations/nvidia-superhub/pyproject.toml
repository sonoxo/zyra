[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-superhub"
version = "0.1.0"
description = "License-aware orchestration for NVIDIA's public GitHub ecosystem"
requires-python = ">=3.10"

[project.scripts]
superhub = "superhub.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]


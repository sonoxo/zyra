name: Baseline Assurance CI

on:
  pull_request:
    paths:
      - "server/baseline-assurance.ts"
      - "server/index.ts"
      - "client/src/pages/baseline-assurance.tsx"
      - "client/src/App.tsx"
      - "script/baseline-assurance-verify.ts"
      - ".github/workflows/baseline-assurance-ci.yml"
  push:
    branches:
      - feature/bas-detection-assurance

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify defensive BAS contract
        run: npx tsx script/baseline-assurance-verify.ts

      - name: TypeScript check
        run: npm run check

      - name: Production build
        run: npm run build

name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to deploy"
        required: true
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  preflight:
    name: Production Preflight
    uses: sonoxo/aip-community-registry-zyra/.github/workflows/node-quality-gate.yml@82de1196b406d35166e1bb94f2c44e4e4709a235
    with:
      node-version: "20"
      checkout-ref: ${{ github.event.inputs.version || github.event.release.tag_name }}
      run-tests: true
      run-typecheck: true
      run-audit: true
      audit-level: "high"
      run-build: true

  deploy:
    name: Deploy Production
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Deploy to production
        run: |
          echo "Registry preflight passed."
          echo "Deploying version: ${{ github.event.inputs.version || github.event.release.tag_name }}"
          echo "Primary deployment is managed by Replit Deployments."
          echo "For self-hosted production, configure the authorized deployment target in this step."
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

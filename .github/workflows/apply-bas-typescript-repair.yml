name: Apply BAS TypeScript Repair

on:
  push:
    branches:
      - feature/bas-detection-assurance
    paths:
      - .github/workflows/apply-bas-typescript-repair.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BAS branch
        uses: actions/checkout@v4
        with:
          ref: feature/bas-detection-assurance
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Pin compatible Express route parameter types
        run: npm install --package-lock-only --save-dev --save-exact @types/express-serve-static-core@5.0.7
      - name: Install locked dependencies
        run: npm ci
      - name: Apply schema repairs
        run: node script/typescript-schema-repair.mjs
      - name: Verify defensive BAS contract
        run: npx tsx script/baseline-assurance-verify.ts
      - name: TypeScript check
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Commit verified repairs
        run: |
          git diff --check
          if git diff --quiet -- package.json package-lock.json client server; then
            echo "No repair required"
            exit 0
          fi
          git config user.name "zyra-ci-repair"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json client server
          git commit -m "fix: align BAS branch with current schemas"
          git push origin HEAD:feature/bas-detection-assurance

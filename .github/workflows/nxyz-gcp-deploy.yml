name: NXYZ GCP Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/nxyz-gcp/**"
      - "infra/gcp/**"
      - ".github/workflows/nxyz-gcp-deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: nxyz-gcp-production
  cancel-in-progress: false

env:
  SERVICE: nxyz-control
  REGION: ${{ vars.GCP_REGION || 'us-east4' }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'nxyz' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required GCP configuration
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          NXYZ_RUNTIME_SERVICE_ACCOUNT: ${{ vars.NXYZ_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for variable in GCP_PROJECT_ID GCP_WIF_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT NXYZ_RUNTIME_SERVICE_ACCOUNT; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required GitHub Actions variable: $variable" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        shell: bash
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push NXYZ image
        id: image
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build \
            --file services/nxyz-gcp/Dockerfile \
            --tag "$IMAGE" \
            services/nxyz-gcp
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy NXYZ to Cloud Run
        id: deploy
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RUNTIME_SA: ${{ vars.NXYZ_RUNTIME_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=40 \
            --min=0 \
            --max=10 \
            --timeout=60 \
            --set-env-vars="NXYZ_ENV=production,NXYZ_REGION=${REGION}" \
            --update-secrets="NXYZ_API_KEY=nxyz-api-key:latest" \
            --quiet

          URL="$(gcloud run services describe "$SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify health endpoint
        shell: bash
        env:
          NXYZ_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            "${NXYZ_URL}/healthz"
          echo

      - name: Deployment summary
        shell: bash
        env:
          NXYZ_URL: ${{ steps.deploy.outputs.url }}
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          {
            echo "## NXYZ GCP deployment"
            echo
            echo "- Cloud Run: ${NXYZ_URL}"
            echo "- Image: ${IMAGE}"
            echo "- Region: ${REGION}"
            echo "- Service: ${SERVICE}"
          } >> "$GITHUB_STEP_SUMMARY"

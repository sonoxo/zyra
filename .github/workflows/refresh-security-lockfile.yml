name: Refresh Security Lockfile

on:
  push:
    branches: [feature/zyra-registry-security]
    paths:
      - package.json
      - .github/workflows/refresh-security-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/zyra-registry-security

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Refresh dependency graph within declared ranges
        run: npm update --package-lock-only

      - name: Apply non-breaking audit remediations
        run: npm audit fix --package-lock-only || true

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for security patches"
          git push origin HEAD:feature/zyra-registry-security

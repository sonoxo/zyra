name: TSC CI

on:
  pull_request:
    paths:
      - 'client/src/pages/tsc.tsx'
      - 'client/src/App.tsx'
      - '.github/workflows/tsc-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm run build

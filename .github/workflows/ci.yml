name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registry-quality:
    name: Registry Quality
    uses: sonoxo/aip-community-registry-zyra/.github/workflows/node-quality-gate.yml@80af170e1097015c5135f544c7546cae691f2e04
    with:
      node-version: "20"
      verify-command: "node -e \"const r=require('./.black-house/runtime.json'); if(r.controlPlane!=='THE_BLACK_HOUSE_V1'||r.component!=='ZYRA') process.exit(1); console.log('BLACK HOUSE ZYRA CONTRACT: PASS')\""
      run-tests: true
      test-command: "npm test"
      run-typecheck: true
      typecheck-command: "npm run check"
      run-audit: true
      audit-level: "high"
      run-build: true
      build-command: "npm run build"

  security-gate:
    name: Security Gate
    needs: registry-quality
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce registry quality result
        env:
          QUALITY_RESULT: ${{ needs.registry-quality.result }}
        run: |
          echo "Registry quality result: ${QUALITY_RESULT}"
          test "${QUALITY_RESULT}" = "success"
      - name: Validate Black House runtime contract
        run: |
          node <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const runtime = JSON.parse(fs.readFileSync('.black-house/runtime.json','utf8'));
          assert.equal(runtime.controlPlane, 'THE_BLACK_HOUSE_V1');
          assert.equal(runtime.component, 'ZYRA');
          assert.equal(runtime.cloudLayer, 'Zyra Cloud');
          for (const gate of ['npm test','npm run check','npm audit --audit-level=high','npm run build']) {
            assert.ok(runtime.requiredGates.includes(gate), `missing runtime gate: ${gate}`);
          }
          console.log('BLACK HOUSE ZYRA RUNTIME CONTRACT: PASS');
          NODE

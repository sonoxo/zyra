name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registry-quality:
    name: Registry Quality
    uses: sonoxo/aip-community-registry-zyra/.github/workflows/node-quality-gate.yml@82de1196b406d35166e1bb94f2c44e4e4709a235
    with:
      node-version: "20"
      run-tests: true
      test-command: "npm test"
      run-typecheck: true
      typecheck-command: "npm run check"
      run-audit: true
      audit-level: "high"
      run-build: true
      build-command: "npm run build"

  security-gate:
    name: Security Gate
    needs: registry-quality
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce registry quality result
        env:
          QUALITY_RESULT: ${{ needs.registry-quality.result }}
        run: |
          echo "Registry quality result: ${QUALITY_RESULT}"
          test "${QUALITY_RESULT}" = "success"

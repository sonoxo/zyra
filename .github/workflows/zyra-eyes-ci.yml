name: ZYRA Eyes CI

on:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**"]
    paths:
      - "server/zyra-eyes.ts"
      - "server/zyra-eyes.test.ts"
      - "apps/zyra-eyes-plugin/**"
      - "client/src/pages/zyra-eyes.tsx"
      - "shared/ontology/rvia-vision-control.yaml"
      - "shared/policy/us-cz-ethical-scope.yaml"
      - "docs/ZYRA-EYES-RVIA.md"
      - "docs/ZYRA-EYES-SYSTEM-CONTROLLER.md"
      - "docs/ZYRA-EYES-SMOOTH-CURSOR.md"
      - ".github/workflows/zyra-eyes-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "server/zyra-eyes.ts"
      - "server/zyra-eyes.test.ts"
      - "apps/zyra-eyes-plugin/**"
      - "client/src/pages/zyra-eyes.tsx"
      - "shared/ontology/rvia-vision-control.yaml"
      - "shared/policy/us-cz-ethical-scope.yaml"
      - "docs/ZYRA-EYES-RVIA.md"
      - "docs/ZYRA-EYES-SYSTEM-CONTROLLER.md"
      - "docs/ZYRA-EYES-SMOOTH-CURSOR.md"

permissions:
  contents: read

jobs:
  eyes-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: ZYRA Eyes tests
        run: npx tsx --test server/zyra-eyes.test.ts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: |
          python -m py_compile apps/zyra-eyes-plugin/zyra_eyes.py
          python -m py_compile apps/zyra-eyes-plugin/zyra_gaze.py
          python -m py_compile apps/zyra-eyes-plugin/zyra_system_controller.py
          python -m py_compile apps/zyra-eyes-plugin/zyra_smooth_controller.py

      - name: Gaze safety invariants
        run: |
          grep -q 'NATIVE_SENTINEL = "I_OWN_AND_AUTHORIZE_THIS_MACHINE"' apps/zyra-eyes-plugin/zyra_gaze.py
          grep -q 'PyAutoGUI' apps/zyra-eyes-plugin/zyra_gaze.py
          grep -q 'Native gaze control requires --approve' apps/zyra-eyes-plugin/zyra_gaze.py

      - name: System controller safety invariants
        run: |
          grep -q 'NATIVE_SENTINEL = "I_OWN_AND_AUTHORIZE_THIS_MACHINE"' apps/zyra-eyes-plugin/zyra_system_controller.py
          grep -q 'Native system control requires --approve' apps/zyra-eyes-plugin/zyra_system_controller.py
          grep -q 'Remote control is intentionally out of scope' apps/zyra-eyes-plugin/zyra_system_controller.py
          grep -q 'PyAutoGUI corner failsafe is enabled' apps/zyra-eyes-plugin/zyra_system_controller.py
          grep -q 'dwell timing is too short for safe use' apps/zyra-eyes-plugin/zyra_system_controller.py

      - name: Smooth cursor invariants
        run: |
          grep -q 'One Euro adaptive gaze filter' apps/zyra-eyes-plugin/zyra_smooth_controller.py
          grep -q 'CursorMotionEngine' apps/zyra-eyes-plugin/zyra_smooth_controller.py
          grep -q 'rate_hz' apps/zyra-eyes-plugin/zyra_smooth_controller.py
          grep -q 'require_native_authorization' apps/zyra-eyes-plugin/zyra_smooth_controller.py
          grep -q 'PyAutoGUI corner failsafe' apps/zyra-eyes-plugin/zyra_smooth_controller.py

      - name: Policy invariants
        run: |
          grep -q "simulationDefault: true" server/zyra-eyes.ts
          grep -q "nativeExecutionDefault: false" server/zyra-eyes.ts
          grep -q "legalOverride: false" shared/ontology/rvia-vision-control.yaml
          grep -q "policyOverride: false" shared/ontology/rvia-vision-control.yaml

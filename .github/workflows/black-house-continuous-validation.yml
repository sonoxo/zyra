name: Black House Continuous Validation

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/black-house/continuous-validator.mjs"
      - "scripts/black-house/continuous-validator.test.mjs"
      - "examples/black-house-validation/**"
      - ".github/workflows/black-house-continuous-validation.yml"
      - "docs/BLACK-HOUSE-CONTINUOUS-VALIDATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Continuous Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validator unit tests
        run: node --test scripts/black-house/continuous-validator.test.mjs

      - name: Run migration validation proof
        run: |
          node scripts/black-house/continuous-validator.mjs \
            --source examples/black-house-validation/source.json \
            --target examples/black-house-validation/target.json \
            --key id \
            --threshold 99 \
            --out .black-house/evidence/continuous-validation.json

      - name: Publish evidence summary
        if: always()
        run: |
          if [[ -f .black-house/evidence/continuous-validation.json ]]; then
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(".black-house/evidence/continuous-validation.json","utf8"));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`# Black House Continuous Validation\n\n- Verdict: **${x.verdict}**\n- Accuracy: **${x.metrics.validationAccuracyPct}%**\n- Threshold: **${x.threshold}%**\n- Exact: ${x.metrics.exactMatches}\n- Changed: ${x.metrics.changedRecords}\n- Missing: ${x.metrics.missingRecords}\n- Unexpected: ${x.metrics.unexpectedRecords}\n- Engine: ${x.engine}\n`);'
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-house-continuous-validation-${{ github.run_id }}
          path: .black-house/evidence/continuous-validation.json
          if-no-files-found: warn
          retention-days: 30

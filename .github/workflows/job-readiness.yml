name: Job Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  verify:
    name: Job Readiness Contract
    uses: sonoxo/aip-community-registry-zyra/.github/workflows/node-quality-gate.yml@82de1196b406d35166e1bb94f2c44e4e4709a235
    with:
      node-version: "20"
      run-tests: false
      verify-command: "test -f client/src/pages/job-readiness.tsx && test -f docs/JOB_READINESS.md && grep -q 'path=\"/job-readiness\"' client/src/App.tsx && grep -q 'Zyra Job Readiness' client/src/pages/job-readiness.tsx"
      run-typecheck: false
      run-audit: false
      run-build: false

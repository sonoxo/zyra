<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">How XuniDirect Fits the Ecosystem</title><desc id="desc">User to XuniDirect to YouTube Data API, supported by Zyra and Black House.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#120b2b"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#25e8ff"/><stop offset="1" stop-color="#9f6cff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173049" stroke-width="1" opacity=".35"/></pattern></defs><rect width="1400" height="820" rx="28" fill="url(#bg)"/><rect x="1.5" y="1.5" width="1397" height="817" rx="27" fill="none" stroke="url(#a)" stroke-width="2"/><rect width="1400" height="820" rx="28" fill="url(#grid)" opacity=".4"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><g transform="translate(54 40)"><path d="M0 0L32 32M32 0L0 32" stroke="url(#a)" stroke-width="10" stroke-linecap="round" filter="url(#g)"/><text x="54" y="25" fill="#fff" font-size="19" font-weight="700" letter-spacing="8">XUNIA</text></g><text x="58" y="145" font-size="61" font-weight="800" fill="url(#a)">How XuniDirect</text><text x="58" y="208" font-size="61" font-weight="800" fill="url(#a)">Fits the Ecosystem</text><rect x="58" y="235" width="630" height="2" fill="url(#a)"/><text x="60" y="276" fill="#b7c4d5" font-size="21">A simple view of the browser tool, platform layer, governance layer,</text><text x="60" y="306" fill="#b7c4d5" font-size="21">and official API working together while the user stays in control.</text><g transform="translate(875 78)"><rect width="445" height="150" rx="22" fill="#091525" stroke="#315978"/><circle cx="62" cy="75" r="37" fill="#071520" stroke="#2de6ff"/><path d="M62 48l8 17 19 3-14 13 3 19-16-9-17 9 4-19-14-13 19-3z" fill="none" stroke="#2de6ff" stroke-width="3"/><text x="118" y="57" fill="#2de6ff" font-size="24" font-weight="800">Beginner Friendly</text><text x="118" y="88" fill="#dbe7f7" font-size="17">Each layer has one clear role.</text><text x="118" y="115" fill="#dbe7f7" font-size="17">You decide what happens.</text></g><g transform="translate(190 360)"><g transform="translate(150 -20)"><rect width="380" height="145" rx="22" fill="#0b1125" stroke="#9c6cff" stroke-width="2"/><circle cx="65" cy="72" r="39" fill="#17102f" stroke="#9c6cff"/><path d="M45 55l20-12 20 12v34L65 101 45 89zM45 55l20 12 20-12M65 67v34" fill="none" stroke="#a77cff" stroke-width="3"/><text x="125" y="52" fill="#a77cff" font-size="27" font-weight="800">Zyra</text><text x="125" y="82" fill="#fff" font-size="19">runtime + platform</text><text x="125" y="111" fill="#aebdd0" font-size="15">Shared runtime, services, infrastructure.</text></g><g transform="translate(705 -20)"><rect width="380" height="145" rx="22" fill="#091525" stroke="#2de6ff" stroke-width="2"/><circle cx="65" cy="72" r="39" fill="#071520" stroke="#2de6ff"/><path d="M65 43l24 11v19c0 20-12 34-24 42-12-8-24-22-24-42V54z" fill="none" stroke="#2de6ff" stroke-width="3"/><path d="M55 75l8 8 14-16" fill="none" stroke="#2de6ff" stroke-width="3"/><text x="125" y="52" fill="#2de6ff" font-size="27" font-weight="800">Black House</text><text x="125" y="82" fill="#fff" font-size="19">policy + approval</text><text x="125" y="111" fill="#aebdd0" font-size="15">Rules, review, human-controlled safety.</text></g><path d="M340 125v80M895 125v80" stroke="#6e78ff" stroke-width="3" stroke-dasharray="7 8"/><path d="M340 205H610M895 205H750" stroke="#6e78ff" stroke-width="3" stroke-dasharray="7 8"/><g transform="translate(-120 240)"><rect width="330" height="150" rx="22" fill="#091525" stroke="#2de6ff" stroke-width="2"/><circle cx="68" cy="74" r="40" fill="#071520" stroke="#2de6ff"/><circle cx="68" cy="60" r="14" fill="none" stroke="#dbe7f7" stroke-width="3"/><path d="M42 103c4-22 48-22 52 0" fill="none" stroke="#dbe7f7" stroke-width="3"/><text x="130" y="60" fill="#2de6ff" font-size="27" font-weight="800">User</text><text x="130" y="91" fill="#dbe7f7" font-size="17">You stay in control.</text><text x="130" y="117" fill="#dbe7f7" font-size="17">You choose the action.</text></g><text x="224" y="332" fill="#2de6ff" font-size="42">→</text><g transform="translate(275 240)"><rect width="430" height="150" rx="22" fill="#0a1422" stroke="url(#a)" stroke-width="3"/><path d="M45 48L92 101M92 48L45 101" stroke="url(#a)" stroke-width="13" stroke-linecap="round" filter="url(#g)"/><text x="135" y="63" fill="#2de6ff" font-size="31" font-weight="800">XuniDirect</text><text x="135" y="94" fill="#fff" font-size="20">browser tool</text><text x="135" y="122" fill="#aebdd0" font-size="16">Scan → filter → preview → confirm.</text></g><text x="719" y="332" fill="#8c7dff" font-size="42">→</text><g transform="translate(770 240)"><rect width="350" height="150" rx="22" fill="#0b1125" stroke="#9c6cff" stroke-width="2"/><circle cx="67" cy="74" r="40" fill="#17102f" stroke="#9c6cff"/><ellipse cx="67" cy="57" rx="22" ry="10" fill="none" stroke="#a77cff" stroke-width="3"/><path d="M45 57v34c0 6 44 6 44 0V57M45 74c0 6 44 6 44 0" fill="none" stroke="#a77cff" stroke-width="3"/><text x="130" y="60" fill="#a77cff" font-size="25" font-weight="800">YouTube Data API</text><text x="130" y="92" fill="#dbe7f7" font-size="17">Returns subscription data</text><text x="130" y="118" fill="#dbe7f7" font-size="17">and accepts confirmed actions.</text></g></g><g transform="translate(60 690)"><rect width="820" height="82" rx="20" fill="#091525" stroke="#315978"/><circle cx="48" cy="41" r="27" fill="#071520" stroke="#2de6ff"/><text x="39" y="50" fill="#2de6ff" font-size="24">i</text><text x="95" y="37" fill="#2de6ff" font-size="21" font-weight="800">Simple view:</text><text x="95" y="63" fill="#dbe7f7" font-size="18">you stay in control while XuniDirect handles the workflow.</text></g><g transform="translate(925 680)"><rect width="400" height="102" rx="20" fill="#0b1125" stroke="#48386e"/><circle cx="28" cy="27" r="7" fill="#2de6ff"/><text x="48" y="34" fill="#dbe7f7" font-size="16">XuniDirect = browser tool</text><circle cx="28" cy="53" r="7" fill="#a77cff"/><text x="48" y="60" fill="#dbe7f7" font-size="16">Zyra = platform layer</text><circle cx="28" cy="79" r="7" fill="#2de6ff"/><text x="48" y="86" fill="#dbe7f7" font-size="16">Black House = governance layer</text></g></g></svg>
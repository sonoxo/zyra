<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Run XuniDirect Locally</title><desc id="desc">A simple four-step setup for beginners.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#120b2b"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#25e8ff"/><stop offset="1" stop-color="#9f6cff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173049" stroke-width="1" opacity=".35"/></pattern></defs>
<rect width="1400" height="820" rx="28" fill="url(#bg)"/><rect x="1.5" y="1.5" width="1397" height="817" rx="27" fill="none" stroke="url(#a)" stroke-width="2"/><rect width="1400" height="820" rx="28" fill="url(#grid)" opacity=".4"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<g transform="translate(54 40)"><path d="M0 0L32 32M32 0L0 32" stroke="url(#a)" stroke-width="10" stroke-linecap="round" filter="url(#g)"/><text x="54" y="25" fill="#fff" font-size="19" font-weight="700" letter-spacing="8">XUNIA</text></g>
<text x="58" y="150" font-size="65" font-weight="800" fill="url(#a)">Run XuniDirect Locally</text><text x="60" y="205" font-size="28" fill="#b7c4d5">A simple 4-step setup</text><rect x="60" y="235" width="700" height="2" fill="url(#a)"/>
<g transform="translate(48 285)">
  <g><rect width="310" height="390" rx="22" fill="#091525" stroke="#2de6ff" stroke-opacity=".65"/><circle cx="45" cy="44" r="25" fill="#082335" stroke="#2de6ff"/><text x="37" y="53" fill="#fff" font-size="25" font-weight="800">1</text><path d="M155 80v72m-25-24 25 25 25-25M115 169h80v50h-80z" fill="none" stroke="#2de6ff" stroke-width="6" stroke-linecap="round"/><text x="46" y="258" fill="#2de6ff" font-size="25" font-weight="800">Clone the repo</text><rect x="28" y="285" width="254" height="70" rx="12" fill="#07101c" stroke="#1f5974"/><text x="42" y="313" fill="#dbe7f7" font-family="monospace" font-size="13">git clone https://</text><text x="42" y="338" fill="#dbe7f7" font-family="monospace" font-size="13">github.com/sonoxo/zyra.git</text></g>
  <text x="322" y="205" fill="#41eaff" font-size="32">→</text>
  <g transform="translate(350)"><rect width="310" height="390" rx="22" fill="#0b1125" stroke="#9c6cff" stroke-opacity=".75"/><circle cx="45" cy="44" r="25" fill="#17102f" stroke="#9c6cff"/><text x="37" y="53" fill="#fff" font-size="25" font-weight="800">2</text><path d="M106 111h52l18 18h42v95H106z" fill="none" stroke="#a77cff" stroke-width="6"/><text x="70" y="258" fill="#a77cff" font-size="23" font-weight="800">Open the extension</text><text x="108" y="287" fill="#a77cff" font-size="23" font-weight="800">folder</text><rect x="20" y="304" width="270" height="64" rx="12" fill="#07101c" stroke="#4c397a"/><text x="34" y="330" fill="#dbe7f7" font-family="monospace" font-size="11">cd zyra/integrations/</text><text x="34" y="349" fill="#dbe7f7" font-family="monospace" font-size="11">xunidirect-youtube-cleaner/...</text></g>
  <text x="672" y="205" fill="#41eaff" font-size="32">→</text>
  <g transform="translate(700)"><rect width="310" height="390" rx="22" fill="#091525" stroke="#2de6ff" stroke-opacity=".65"/><circle cx="45" cy="44" r="25" fill="#082335" stroke="#2de6ff"/><text x="37" y="53" fill="#fff" font-size="25" font-weight="800">3</text><circle cx="155" cy="153" r="57" fill="none" stroke="#2de6ff" stroke-width="6"/><circle cx="155" cy="153" r="22" fill="none" stroke="#2de6ff" stroke-width="6"/><path d="M155 80v20M155 206v20M82 153h20M208 153h20" stroke="#2de6ff" stroke-width="6"/><text x="60" y="258" fill="#2de6ff" font-size="23" font-weight="800">Load unpacked in Chrome</text><text x="36" y="306" fill="#dbe7f7" font-size="14">Open chrome://extensions</text><text x="36" y="334" fill="#dbe7f7" font-size="14">→ turn on Developer mode</text><text x="36" y="362" fill="#dbe7f7" font-size="14">→ click Load unpacked</text></g>
  <text x="1022" y="205" fill="#a77cff" font-size="32">→</text>
  <g transform="translate(1050)"><rect width="302" height="390" rx="22" fill="#0b1125" stroke="#9c6cff" stroke-opacity=".75"/><circle cx="45" cy="44" r="25" fill="#17102f" stroke="#9c6cff"/><text x="37" y="53" fill="#fff" font-size="25" font-weight="800">4</text><circle cx="151" cy="150" r="61" fill="none" stroke="#a77cff" stroke-width="5"/><path d="M116 151h20l12-28 18 54 13-31h16" fill="none" stroke="#a77cff" stroke-width="5" stroke-linejoin="round"/><text x="68" y="258" fill="#a77cff" font-size="25" font-weight="800">Connect and scan</text><text x="40" y="307" fill="#dbe7f7" font-size="15">Open XuniDirect, connect</text><text x="40" y="333" fill="#dbe7f7" font-size="15">your YouTube account, set</text><text x="40" y="359" fill="#dbe7f7" font-size="15">your filter, and scan.</text></g>
</g>
<g transform="translate(55 712)"><rect width="1290" height="72" rx="20" fill="#091525" stroke="#3d5a80"/><circle cx="46" cy="36" r="24" fill="#082335" stroke="#2de6ff"/><text x="37" y="45" fill="#2de6ff" font-size="23">i</text><text x="88" y="44" fill="#2de6ff" font-size="21" font-weight="800">Tip:</text><text x="138" y="44" fill="#dbe7f7" font-size="20">select the unzipped extension folder, not a ZIP file.</text></g>
</g></svg>
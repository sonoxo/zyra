<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Zyra beginner friendly function map</title>
<desc id="desc">A plain-language diagram showing what happens when a beginner uses Zyra Live Implement: type a mission, Zyra reads it, chooses an operation, connects to Foundry, performs the requested Ontology operation, and shows the result.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02040b"/><stop offset=".52" stop-color="#09152d"/><stop offset="1" stop-color="#1e0b36"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42f5ff"/><stop offset="1" stop-color="#8d6bff"/></linearGradient>
  <linearGradient id="good" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42f5ff"/><stop offset="1" stop-color="#9cff57"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#83a4ff" stroke-opacity=".055"/></pattern>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L0 8L10 4Z" fill="#62efff"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.kicker{font-size:14px;fill:#5af2ff;font-weight:800;letter-spacing:4px}.hero{font-size:58px;fill:#fff;font-weight:900}.sub{font-size:20px;fill:#aab8d5}.num{font-size:15px;fill:#62efff;font-weight:900}.title{font-size:27px;fill:#fff;font-weight:900}.plain{font-size:17px;fill:#d7e2f5}.code{font-size:12px;fill:#a8ff60}.tiny{font-size:11px;fill:#8fa1c4}.card{fill:#081226;stroke:#36547f;stroke-width:1.5}.hot{fill:#0a1428;stroke:url(#accent);stroke-width:2}.good{fill:#07191a;stroke:url(#good);stroke-width:2}.wire{fill:none;stroke:#62efff;stroke-width:3;stroke-opacity:.82;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="980" rx="34" fill="url(#bg)"/><rect width="1600" height="980" rx="34" fill="url(#grid)"/>
<text x="70" y="68" class="kicker">VZN // ZYRA LIVE IMPLEMENT // BEGINNER VIEW</text>
<text x="70" y="132" class="hero">WHAT HAPPENS WHEN YOU USE ZYRA?</text>
<text x="70" y="172" class="sub">You type what you want. Zyra translates it into a real operation, runs it through the checked-in code, and shows you the result.</text>

<g transform="translate(70 235)"><rect width="430" height="180" rx="22" class="hot"/><text x="24" y="34" class="num">STEP 1</text><text x="24" y="76" class="title">YOU TYPE A MISSION</text><text x="24" y="108" class="plain">Example: “show me the available ontologies.”</text><text x="24" y="138" class="code mono">/VAL3M  •  LIST ONTOLOGIES</text><text x="24" y="161" class="tiny mono">real file: apps/zyra-live-implement/public/index.html</text></g>

<g transform="translate(585 235)"><rect width="430" height="180" rx="22" class="card"/><text x="24" y="34" class="num">STEP 2</text><text x="24" y="76" class="title">ZYRA READS YOUR WORDS</text><text x="24" y="108" class="plain">It turns the mission into simple structured steps.</text><text x="24" y="138" class="code mono">parseVirginia() → mode + agents + steps[]</text><text x="24" y="161" class="tiny mono">real file: apps/zyra-live-implement/src/virginia.ts</text></g>

<g transform="translate(1100 235)"><rect width="430" height="180" rx="22" class="hot"/><text x="24" y="34" class="num">STEP 3</text><text x="24" y="76" class="title">ZYRA PICKS THE JOB</text><text x="24" y="108" class="plain">It matches your request to a supported operation.</text><text x="24" y="136" class="code mono">LIST • READ • APPLY ACTION • NOTE</text><text x="24" y="161" class="tiny mono">real function: executeStep() in server.ts</text></g>

<path class="wire" d="M500 325H570"/><path class="wire" d="M1015 325H1085"/>

<g transform="translate(70 505)"><rect width="430" height="195" rx="22" class="card"/><text x="24" y="34" class="num">STEP 4</text><text x="24" y="76" class="title">ZYRA CONNECTS SECURELY</text><text x="24" y="108" class="plain">The server connects to Palantir Foundry for you.</text><text x="24" y="138" class="code mono">foundry() + Bearer token</text><text x="24" y="162" class="tiny">Your Foundry token stays on the server, not in the browser.</text><text x="24" y="181" class="tiny mono">server env: FOUNDRY_BASE_URL + FOUNDRY_TOKEN</text></g>

<g transform="translate(585 505)"><rect width="430" height="195" rx="22" class="card"/><text x="24" y="34" class="num">STEP 5</text><text x="24" y="76" class="title">THE REAL WORK HAPPENS</text><text x="24" y="108" class="plain">Zyra can list Ontologies, object types, objects,</text><text x="24" y="132" class="plain">or apply an approved Ontology action.</text><text x="24" y="160" class="code mono">GET /api/v2/ontologies  •  POST .../apply</text><text x="24" y="181" class="tiny mono">real routes are wired in apps/zyra-live-implement/server.ts</text></g>

<g transform="translate(1100 505)"><rect width="430" height="195" rx="22" class="good"/><text x="24" y="34" class="num">STEP 6</text><text x="24" y="76" class="title">YOU SEE THE RESULT</text><text x="24" y="108" class="plain">The browser shows what Zyra received back.</text><text x="24" y="138" class="code mono">mission + results + completed + stopWhen</text><text x="24" y="162" class="plain">No guessing: the output is visible as JSON evidence.</text><text x="24" y="181" class="tiny mono">health check: GET /api/health</text></g>

<path class="wire" d="M1315 415V463H285V490"/><path class="wire" d="M500 602H570"/><path class="wire" d="M1015 602H1085"/>

<g transform="translate(70 770)"><rect width="1460" height="145" rx="22" fill="#07101f" stroke="#36547f"/><text x="26" y="38" class="num">THE WHOLE THING IN ONE LINE</text><text x="26" y="78" class="title">YOU ASK → ZYRA UNDERSTANDS → ZYRA CHOOSES → FOUNDRY RUNS → YOU GET THE RESULT</text><text x="26" y="112" class="plain">Under the hood: browser → /api/virginia/execute → parseVirginia() → executeStep() → foundry() → Ontology API → evidence panel.</text><text x="26" y="134" class="tiny">This graphic describes functions that are actually present on feature/virginia-aip-live-implement. It is not a decorative capability claim.</text></g>

<text x="70" y="954" class="tiny mono">BEGINNER RULE: big text explains WHAT happens. small green text shows WHERE it happens in the repo.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">ZYRA Credential Pathway Identity Seal</title>
  <desc id="desc">Internal ZYRA identity seal for credential-pathway documentation. Navy, gold and silver circular cyber-defense emblem with shield, compass and circuit motif.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="66%">
      <stop offset="0" stop-color="#102b4b"/>
      <stop offset="0.72" stop-color="#061a32"/>
      <stop offset="1" stop-color="#02101f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset="0.24" stop-color="#d7a73b"/>
      <stop offset="0.55" stop-color="#f6d77b"/>
      <stop offset="1" stop-color="#946316"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.5" stop-color="#aeb9c5"/>
      <stop offset="1" stop-color="#5d6977"/>
    </linearGradient>
    <path id="topArc" d="M 174 602 A 426 426 0 0 1 1026 602"/>
    <path id="bottomArc" d="M 1008 700 A 420 420 0 0 1 192 700"/>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <circle cx="600" cy="600" r="570" fill="url(#bg)"/>
  <circle cx="600" cy="600" r="548" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <circle cx="600" cy="600" r="513" fill="none" stroke="#d6a744" stroke-width="3"/>
  <circle cx="600" cy="600" r="415" fill="none" stroke="#d6a744" stroke-width="3" opacity=".9"/>

  <text fill="#f4f6f8" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="11" font-weight="700">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ZYRA • CREDENTIAL PATHWAY</textPath>
  </text>
  <text fill="#f4f6f8" font-family="Georgia, 'Times New Roman', serif" font-size="38" letter-spacing="8" font-weight="700">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">INTELLIGENCE • CYBER DEFENSE • PROVENANCE</textPath>
  </text>

  <g filter="url(#shadow)">
    <path d="M600 292 L820 378 L790 694 Q760 870 600 954 Q440 870 410 694 L380 378 Z" fill="url(#silver)" stroke="url(#gold)" stroke-width="14"/>
    <path d="M600 326 L780 397 L754 681 Q727 825 600 896 Q473 825 446 681 L420 397 Z" fill="#0a2744" stroke="#07172a" stroke-width="5"/>
  </g>

  <g stroke="#cbd3dc" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M470 520 H532 L566 554"/>
    <path d="M454 594 H526"/>
    <path d="M470 670 H532 L566 636"/>
    <path d="M730 520 H668 L634 554"/>
    <path d="M746 594 H674"/>
    <path d="M730 670 H668 L634 636"/>
    <path d="M600 432 V506"/>
    <path d="M600 682 V756"/>
  </g>
  <g fill="url(#gold)" stroke="#07172a" stroke-width="5">
    <circle cx="470" cy="520" r="14"/><circle cx="454" cy="594" r="14"/><circle cx="470" cy="670" r="14"/>
    <circle cx="730" cy="520" r="14"/><circle cx="746" cy="594" r="14"/><circle cx="730" cy="670" r="14"/>
    <circle cx="600" cy="432" r="14"/><circle cx="600" cy="756" r="14"/>
  </g>

  <circle cx="600" cy="594" r="139" fill="#071d36" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="600" cy="594" r="104" fill="none" stroke="#c49a3d" stroke-width="3"/>
  <path d="M600 430 L632 558 L760 594 L632 630 L600 758 L568 630 L440 594 L568 558 Z" fill="url(#gold)" stroke="#6f4a12" stroke-width="5"/>
  <path d="M600 488 L616 578 L706 594 L616 610 L600 700 L584 610 L494 594 L584 578 Z" fill="#f8f4df" opacity=".95"/>
  <circle cx="600" cy="594" r="19" fill="#d4a43b" stroke="#07172a" stroke-width="4"/>

  <text x="600" y="214" text-anchor="middle" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="800" letter-spacing="24">ZYRA</text>
  <text x="600" y="1015" text-anchor="middle" fill="#d9dee5" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="5">INTERNAL IDENTITY MARK • OWNER-CONTROLLED</text>
  <text x="600" y="1058" text-anchor="middle" fill="#aeb7c3" font-family="Inter, Arial, sans-serif" font-size="22" letter-spacing="3">VERIFICATION REQUIRES EVIDENCE CHAIN — NOT IMAGE ALONE</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Zyra AI command center ecosystem</title>
<desc id="desc">A cinematic animated interface showing the Zyra core coordinating users, agents, GlassOnion, data, security, and verified delivery.</desc>
<defs>
 <radialGradient id="space"><stop stop-color="#111a42"/><stop offset=".5" stop-color="#090b22"/><stop offset="1" stop-color="#03040d"/></radialGradient>
 <radialGradient id="core"><stop stop-color="#fff"/><stop offset=".13" stop-color="#9ffcff"/><stop offset=".38" stop-color="#18d8ff"/><stop offset=".68" stop-color="#7047ff"/><stop offset="1" stop-color="#17134a"/></radialGradient>
 <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#7df9ff"/><stop offset=".5" stop-color="#00d9ff"/><stop offset="1" stop-color="#a46bff"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11204a" stop-opacity=".92"/><stop offset="1" stop-color="#080b22" stop-opacity=".72"/></linearGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#2ae9ff" stroke-opacity=".07"/></pattern>
 <pattern id="hex" width="62" height="54" patternUnits="userSpaceOnUse"><path d="M15.5 1h31L61 27 46.5 53h-31L1 27z" fill="none" stroke="#705dff" stroke-opacity=".065"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="bigGlow"><feGaussianBlur stdDeviation="18"/></filter>
 <clipPath id="screen"><rect x="18" y="18" width="1364" height="784" rx="32"/></clipPath>
 <style>
  text{font-family:Inter,Segoe UI,Arial,sans-serif}.eyebrow{fill:#75f6ff;font-size:13px;font-weight:800;letter-spacing:4px}.title{fill:#fff;font-size:43px;font-weight:800;letter-spacing:1px}.sub{fill:#9faed5;font-size:17px}.nodeTitle{fill:#fff;font-size:18px;font-weight:800}.nodeSub{fill:#8ea3ca;font-size:12px}.tiny{fill:#88f8ff;font-size:10px;font-weight:700;letter-spacing:2px}.route{fill:none;stroke:url(#cyan);stroke-width:2.2;stroke-opacity:.72;stroke-dasharray:9 13;animation:flow 2.4s linear infinite}.route2{fill:none;stroke:#9a70ff;stroke-width:1;stroke-opacity:.35;stroke-dasharray:3 8;animation:flow 4s linear infinite reverse}.ring{fill:none;stroke:#45efff;stroke-width:1.5;stroke-opacity:.42;stroke-dasharray:8 12;transform-origin:700px 391px;animation:spin 18s linear infinite}.ring2{fill:none;stroke:#9f68ff;stroke-width:2;stroke-opacity:.25;stroke-dasharray:2 17;transform-origin:700px 391px;animation:spin 11s linear infinite reverse}.scan{fill:url(#cyan);opacity:.22;animation:scan 5s ease-in-out infinite}.pulse{transform-origin:700px 391px;animation:pulse 2.5s ease-out infinite}.float1{animation:float 4s ease-in-out infinite}.float2{animation:float 4.8s ease-in-out infinite reverse}.float3{animation:float 5.4s ease-in-out infinite}.particle{fill:#fff;filter:url(#glow)}.p1{offset-path:path('M430 392 C500 392 545 345 605 370');animation:travel 2.8s linear infinite}.p2{offset-path:path('M970 392 C900 392 855 345 795 370');animation:travel 3.1s linear infinite}.p3{offset-path:path('M700 211 C700 270 700 300 700 327');animation:travel 2.3s linear infinite}.p4{offset-path:path('M700 575 C700 525 700 490 700 455');animation:travel 2.6s linear infinite}.bar{animation:bar 3s ease-in-out infinite;transform-origin:left}.blink{animation:blink 1.6s ease-in-out infinite}.dash{stroke-dasharray:180 900;animation:dash 5s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-44}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%{transform:scale(.85);opacity:.55}80%,100%{transform:scale(1.3);opacity:0}}@keyframes scan{0%,100%{transform:translateY(-250px)}50%{transform:translateY(530px)}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes travel{to{offset-distance:100%}}@keyframes bar{50%{transform:scaleX(.68)}}@keyframes blink{50%{opacity:.3}}@keyframes dash{to{stroke-dashoffset:-1080}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
<rect width="1400" height="820" rx="36" fill="url(#space)"/><rect x="18" y="18" width="1364" height="784" rx="32" fill="url(#grid)"/><rect x="18" y="18" width="1364" height="784" rx="32" fill="url(#hex)"/>
<g clip-path="url(#screen)"><rect class="scan" x="18" y="0" width="1364" height="3"/><ellipse cx="700" cy="400" rx="355" ry="250" fill="#263bff" opacity=".07" filter="url(#bigGlow)"/></g>
<path d="M50 62h130l18 18h185M1017 80h185l18-18h130" stroke="#38eaff" stroke-opacity=".35" fill="none"/>
<circle cx="62" cy="62" r="4" fill="#43f4ff" class="blink"/><circle cx="1338" cy="62" r="4" fill="#43f4ff" class="blink"/>
<text x="70" y="105" class="eyebrow">ZYRA // ECOSYSTEM</text><text x="70" y="151" class="title">AI COMMAND CENTER</text><text x="70" y="181" class="sub">One request. Coordinated intelligence. Verified outcome.</text>
<g transform="translate(1090 102)"><rect width="240" height="64" rx="12" fill="#061628" stroke="#2cecff" stroke-opacity=".5"/><circle cx="27" cy="22" r="5" fill="#45ffb7" filter="url(#glow)" class="blink"/><text x="44" y="26" class="tiny" fill="#45ffb7">SYSTEM ONLINE</text><text x="22" y="49" fill="#738cb8" font-size="11">AUDIT • POLICY • EVIDENCE</text></g>
<circle class="ring" cx="700" cy="391" r="168"/><circle class="ring2" cx="700" cy="391" r="205"/><circle cx="700" cy="391" r="128" fill="#12cfff" opacity=".12" filter="url(#bigGlow)" class="pulse"/>
<path class="route" d="M430 392 C500 392 545 345 605 370M970 392 C900 392 855 345 795 370M700 211V327M700 575V455M487 233 C550 273 590 308 622 342M913 233 C850 273 810 308 778 342"/>
<path class="route2" d="M430 392 C500 450 555 477 617 443M970 392 C900 450 845 477 783 443M487 548 C550 508 590 475 622 443M913 548 C850 508 810 475 778 443"/>
<circle class="particle p1" r="4"/><circle class="particle p2" r="4"/><circle class="particle p3" r="4"/><circle class="particle p4" r="4"/>
<g filter="url(#glow)"><circle cx="700" cy="391" r="92" fill="url(#core)" opacity=".93"/><circle cx="700" cy="391" r="66" fill="#07102c" stroke="#b7fbff" stroke-width="2"/><path d="M672 367l28-16 28 16v33l-28 16-28-16z" fill="none" stroke="url(#cyan)" stroke-width="4"/><path d="M680 384h40M700 359v49" stroke="#a8fbff" stroke-width="3"/></g>
<text x="700" y="438" text-anchor="middle" class="tiny">ZYRA CORE</text><text x="700" y="457" text-anchor="middle" fill="#fff" font-size="12">ROUTE • GOVERN • VERIFY</text>
<g class="float1" transform="translate(80 320)"><rect width="350" height="144" rx="22" fill="url(#panel)" stroke="#32eaff" stroke-opacity=".72"/><path d="M0 25V10Q0 0 12 0h25M313 0h25q12 0 12 12v25" stroke="#8df9ff" stroke-width="3" fill="none"/><text x="28" y="35" class="tiny">01 // HUMAN INTENT</text><text x="28" y="70" class="nodeTitle">YOU SET THE MISSION</text><text x="28" y="94" class="nodeSub">Plain-language goals enter through an approved app.</text><rect x="28" y="112" width="250" height="6" rx="3" fill="#152e54"/><rect class="bar" x="28" y="112" width="190" height="6" rx="3" fill="url(#cyan)"/></g>
<g class="float2" transform="translate(970 320)"><rect width="350" height="144" rx="22" fill="url(#panel)" stroke="#a56fff" stroke-opacity=".72"/><text x="28" y="35" class="tiny">06 // VERIFIED DELIVERY</text><text x="28" y="70" class="nodeTitle">RESULT + EVIDENCE</text><text x="28" y="94" class="nodeSub">Useful output, status, provenance and audit trail.</text><circle cx="304" cy="42" r="17" fill="#0b2c32" stroke="#42ffba"/><path d="M296 42l6 6 11-14" fill="none" stroke="#42ffba" stroke-width="3"/></g>
<g class="float3" transform="translate(550 195)"><rect width="300" height="92" rx="18" fill="url(#panel)" stroke="#33eaff" stroke-opacity=".55"/><text x="24" y="30" class="tiny">02 // INTELLIGENCE</text><text x="24" y="59" class="nodeTitle">GPT-DOUG + AGENTS</text><text x="24" y="78" class="nodeSub">Plan • build • analyze • explain</text></g>
<g class="float2" transform="translate(550 526)"><rect width="300" height="92" rx="18" fill="url(#panel)" stroke="#ff5bd7" stroke-opacity=".55"/><text x="24" y="30" class="tiny">05 // TRUST LAYER</text><text x="24" y="59" class="nodeTitle">ZYRA SHIELD</text><text x="24" y="78" class="nodeSub">Identity • scope • policy • audit</text></g>
<g class="float1" transform="translate(292 180)"><rect width="215" height="92" rx="18" fill="url(#panel)" stroke="#8170ff" stroke-opacity=".55"/><text x="22" y="30" class="tiny">03 // GEO EVIDENCE</text><text x="22" y="59" class="nodeTitle">GLASSONION</text><text x="22" y="78" class="nodeSub">Maps • provenance • synthesis</text></g>
<g class="float3" transform="translate(893 180)"><rect width="215" height="92" rx="18" fill="url(#panel)" stroke="#45ffb7" stroke-opacity=".55"/><text x="22" y="30" class="tiny">04 // SYSTEM MEMORY</text><text x="22" y="59" class="nodeTitle">DATA + TOOLS</text><text x="22" y="78" class="nodeSub">Postgres • APIs • services</text></g>
<g transform="translate(72 690)"><text class="tiny" x="0" y="0">LIVE MISSION FLOW</text><path d="M0 35H1256" stroke="#17284b" stroke-width="8" stroke-linecap="round"/><path class="dash" d="M0 35H1256" stroke="url(#cyan)" stroke-width="8" stroke-linecap="round"/><g fill="#080d22" stroke="#46edff"><circle cx="0" cy="35" r="11"/><circle cx="314" cy="35" r="11"/><circle cx="628" cy="35" r="11"/><circle cx="942" cy="35" r="11"/><circle cx="1256" cy="35" r="11"/></g><g fill="#afc2e8" font-size="11" text-anchor="middle"><text x="0" y="67">ASK</text><text x="314" y="67">ROUTE</text><text x="628" y="67">WORK</text><text x="942" y="67">VERIFY</text><text x="1256" y="67">DELIVER</text></g></g>
<text x="70" y="782" fill="#50658d" font-size="10" letter-spacing="2">DEFENSIVE • ORGANIZATION-SCOPED • HUMAN-GOVERNED</text><text x="1330" y="782" text-anchor="end" fill="#50658d" font-size="10" letter-spacing="2">BUILD // TEST // PROVE</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
<title id="title">Zyra repository function topology</title>
<desc id="desc">A concrete diagram of the Zyra repository layers and the VIRGINIA Live Implement request path through browser UI, Express routes, parser, executor, Foundry Ontology API, health, evidence, and verification.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030611"/><stop offset=".52" stop-color="#09162b"/><stop offset="1" stop-color="#1b0b33"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43efff"/><stop offset="1" stop-color="#9a6dff"/></linearGradient>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#74a4ff" stroke-opacity=".055"/></pattern>
 <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#5cf2ff"/></marker>
 <style>
  text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.eyebrow{font-size:13px;fill:#62f1ff;font-weight:800;letter-spacing:4px}.hero{font-size:48px;fill:#fff;font-weight:900}.sub{font-size:16px;fill:#9bacca}.card{fill:#081226;stroke:#304b72;stroke-width:1.5}.core{fill:#0b1730;stroke:url(#edge);stroke-width:2}.violet{fill:#120e2d;stroke:#8d6bff;stroke-width:2}.green{fill:#071b1a;stroke:#78ffb2;stroke-width:2}.label{font-size:11px;fill:#5cefff;font-weight:800;letter-spacing:2px}.title{font-size:21px;fill:#fff;font-weight:850}.body{font-size:13px;fill:#b5c2dc}.code{font-size:12px;fill:#a8ff60}.tiny{font-size:10.5px;fill:#8498bd}.line{fill:none;stroke:#5cf2ff;stroke-width:2;stroke-opacity:.76;marker-end:url(#a)}.dash{fill:none;stroke:#9a78ff;stroke-width:2;stroke-dasharray:8 8;stroke-opacity:.72;marker-end:url(#a)}
 </style>
</defs>
<rect width="1500" height="980" rx="34" fill="url(#bg)"/><rect width="1500" height="980" rx="34" fill="url(#grid)"/>
<text x="65" y="66" class="eyebrow">ZYRA // REPOSITORY FUNCTION TOPOLOGY</text>
<text x="65" y="120" class="hero">CODE PATHS, ROUTES, DATA FLOW — NOT DECORATION</text>
<text x="65" y="153" class="sub">This graphic names the checked-in layers and the execution path implemented on feature/virginia-aip-live-implement.</text>

<!-- repository layers -->
<g transform="translate(65 205)"><rect width="300" height="150" rx="18" class="card"/><text x="18" y="29" class="label">ROOT LAYER // UI</text><text x="18" y="61" class="title">client/src/</text><text x="18" y="88" class="body">React + TypeScript interface</text><text x="18" y="111" class="body">Pages, components, browser helpers</text><text x="18" y="133" class="tiny mono">user interaction → API calls</text></g>
<g transform="translate(405 205)"><rect width="300" height="150" rx="18" class="card"/><text x="18" y="29" class="label">ROOT LAYER // API</text><text x="18" y="61" class="title">server/</text><text x="18" y="88" class="body">Express + TypeScript</text><text x="18" y="111" class="body">Routes, auth, workflows, services</text><text x="18" y="133" class="tiny mono">request → policy → service</text></g>
<g transform="translate(745 205)"><rect width="300" height="150" rx="18" class="card"/><text x="18" y="29" class="label">ROOT LAYER // CONTRACTS</text><text x="18" y="61" class="title">shared/</text><text x="18" y="88" class="body">Zod + Drizzle contracts</text><text x="18" y="111" class="body">Shared schema/types across app layers</text><text x="18" y="133" class="tiny mono">frontend ↔ backend alignment</text></g>
<g transform="translate(1085 205)"><rect width="350" height="150" rx="18" class="green"/><text x="18" y="29" class="label">ROOT LAYER // DATA</text><text x="18" y="61" class="title">PostgreSQL + Drizzle</text><text x="18" y="88" class="body">Durable organization-scoped storage</text><text x="18" y="111" class="body">Backed by the repository schema</text><text x="18" y="133" class="tiny mono">data → application state</text></g>
<path class="line" d="M365 280H397"/><path class="line" d="M705 280H737"/><path class="line" d="M1045 280H1077"/>

<!-- live implement module -->
<g transform="translate(65 410)"><rect width="1370" height="475" rx="26" class="core"/><text x="28" y="36" class="label">SPECIALIZED MODULE // apps/zyra-live-implement/</text><text x="28" y="72" class="title">VIRGINIA + VAL3M + PALANTIR FOUNDRY ONTOLOGY IMPLEMENTATION CONSOLE</text>

<g transform="translate(28 112)"><rect width="245" height="140" rx="16" class="card"/><text x="16" y="28" class="label">A // TERMINAL</text><text x="16" y="58" class="title">public/index.html</text><text x="16" y="84" class="code mono">/VAL3M</text><text x="16" y="104" class="code mono">AGENTS 24</text><text x="16" y="124" class="code mono">LIST ONTOLOGIES</text></g>

<g transform="translate(305 112)"><rect width="280" height="140" rx="16" class="card"/><text x="16" y="28" class="label">B // API</text><text x="16" y="58" class="title">server.ts routes</text><text x="16" y="86" class="code mono">/api/virginia/plan</text><text x="16" y="108" class="code mono">/api/virginia/execute</text><text x="16" y="128" class="tiny">JSON in → JSON out</text></g>

<g transform="translate(617 112)"><rect width="285" height="140" rx="16" class="violet"/><text x="16" y="28" class="label">C // PARSER</text><text x="16" y="58" class="title">parseVirginia()</text><text x="16" y="84" class="body">src/virginia.ts</text><text x="16" y="106" class="code mono">mode • agents • stopWhen</text><text x="16" y="126" class="code mono">steps[]</text></g>

<g transform="translate(934 112)"><rect width="382" height="140" rx="16" class="violet"/><text x="16" y="28" class="label">D // EXECUTOR</text><text x="16" y="58" class="title">executeStep()</text><text x="16" y="84" class="code mono">LIST_ONTOLOGIES • LIST_OBJECT_TYPES</text><text x="16" y="104" class="code mono">LIST_OBJECTS • APPLY_ACTION • NOTE</text><text x="16" y="126" class="tiny">Execution is sequential over mission.steps</text></g>
<path class="line" d="M273 182H297"/><path class="line" d="M585 182H609"/><path class="line" d="M902 182H926"/>

<g transform="translate(170 302)"><rect width="455" height="125" rx="16" class="card"/><text x="16" y="28" class="label">E // FOUNDRY GATEWAY</text><text x="16" y="58" class="title">foundry()</text><text x="16" y="82" class="code mono">Authorization: Bearer FOUNDRY_TOKEN</text><text x="16" y="103" class="tiny mono">FOUNDRY_BASE_URL + server-side token</text></g>

<g transform="translate(660 285)"><rect width="620" height="160" rx="16" class="green"/><text x="16" y="28" class="label">F // ONTOLOGY API v2 CALLS</text><text x="16" y="57" class="code mono">GET  /api/v2/ontologies</text><text x="16" y="79" class="code mono">GET  /api/v2/ontologies/{ontology}/objectTypes</text><text x="16" y="101" class="code mono">GET  /api/v2/ontologies/{ontology}/objects/{objectType}</text><text x="16" y="123" class="code mono">POST /api/v2/ontologies/{ontology}/actions/{action}/apply</text><text x="16" y="146" class="tiny">Live execution requires tenant URL + token configuration.</text></g>
<path class="dash" d="M1125 252V274H395V294"/><path class="line" d="M625 365H652"/>
</g>

<!-- verification output -->
<g transform="translate(65 915)"><text x="0" y="0" class="code mono">RETURN PATH: Foundry response → executeStep result → { mission, results, completed, stopWhen } → browser evidence panel</text><text x="835" y="0" class="tiny mono">HEALTH: GET /api/health → ok / app / mode / foundryConfigured</text></g>
<g transform="translate(65 945)"><text x="0" y="0" class="tiny mono">VERIFICATION LAYER: .github/ workflows + code checks → committed implementation evidence.  The diagram deliberately separates code-present, CI-verified, tenant-configured, and deployed states.</text></g>
</svg>
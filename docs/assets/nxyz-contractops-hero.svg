<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">NXYZ ContractOps federal readiness console</title><desc id="desc">A beginner-friendly flow from registrations and opportunities through Zyra credentials, evidence, proposal review, and submission readiness.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#04111f"/><stop offset=".5" stop-color="#101739"/><stop offset="1" stop-color="#251047"/></linearGradient><linearGradient id="line"><stop stop-color="#2df6ff"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#f5c451"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#65dfff" stroke-opacity=".08"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.pulse{animation:p 3s ease-in-out infinite}.dash{stroke-dasharray:12 10;animation:d 2s linear infinite}@keyframes p{50%{opacity:.6}}@keyframes d{to{stroke-dashoffset:-44}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="560" rx="28" fill="url(#bg)"/><rect width="1200" height="560" rx="28" fill="url(#grid)"/><text x="600" y="74" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" text-anchor="middle">NXYZ CONTRACTOPS</text><text x="600" y="108" fill="#8ceeff" font-family="Inter,Arial,sans-serif" font-size="17" text-anchor="middle" letter-spacing="2">FEDERAL READINESS • EVIDENCE • PROPOSAL CONTROL</text><path class="dash" d="M125 300H1075" stroke="url(#line)" stroke-width="5" fill="none"/><g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g><rect x="45" y="205" width="190" height="145" rx="20" fill="#0b1d31" stroke="#2df6ff"/><text x="140" y="240" fill="#fff" font-size="17" font-weight="700">REGISTRATIONS</text><text x="140" y="276" fill="#f5c451" font-size="14">CAGE: PENDING</text><text x="140" y="300" fill="#a8bbcf" font-size="13">SAM / UEI / SBIR</text><text x="140" y="324" fill="#a8bbcf" font-size="13">verified states only</text></g><g><rect x="285" y="205" width="190" height="145" rx="20" fill="#101a39" stroke="#7c5cff"/><text x="380" y="240" fill="#fff" font-size="17" font-weight="700">OPPORTUNITY</text><text x="380" y="276" fill="#d3c8ff" font-size="14">requirements</text><text x="380" y="300" fill="#d3c8ff" font-size="14">deadline • agency</text><text x="380" y="324" fill="#d3c8ff" font-size="14">bid / no-bid</text></g><g class="pulse"><rect x="525" y="180" width="190" height="195" rx="26" fill="#141b46" stroke="#a855f7" stroke-width="3" filter="url(#glow)"/><text x="620" y="225" fill="#fff" font-size="20" font-weight="800">ZYRA TRUST</text><text x="620" y="262" fill="#9cff57" font-size="14">credentials</text><text x="620" y="288" fill="#9cff57" font-size="14">repository proof</text><text x="620" y="314" fill="#9cff57" font-size="14">provenance</text><text x="620" y="340" fill="#9cff57" font-size="14">authorization checks</text></g><g><rect x="765" y="205" width="190" height="145" rx="20" fill="#251638" stroke="#d261ff"/><text x="860" y="240" fill="#fff" font-size="17" font-weight="700">PROPOSAL</text><text x="860" y="276" fill="#f0cfff" font-size="14">technical approach</text><text x="860" y="300" fill="#f0cfff" font-size="14">evidence coverage</text><text x="860" y="324" fill="#f0cfff" font-size="14">human review</text></g><g><rect x="1005" y="205" width="150" height="145" rx="20" fill="#292217" stroke="#f5c451"/><text x="1080" y="240" fill="#fff" font-size="16" font-weight="700">READY</text><text x="1080" y="278" fill="#f5c451" font-size="14">reviewed</text><text x="1080" y="303" fill="#f5c451" font-size="14">traceable</text><text x="1080" y="328" fill="#f5c451" font-size="14">human submits</text></g></g><text x="600" y="455" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">BEGINNER RULE: IF ZYRA CANNOT TRACE THE CLAIM TO EVIDENCE, IT DOES NOT MARK IT READY.</text><text x="600" y="493" fill="#8195aa" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle">NXYZ / ZYRA • CONTRACT INTELLIGENCE WITHOUT INVENTED REGISTRATIONS OR AUTOMATIC GOVERNMENT SUBMISSION</text></svg>
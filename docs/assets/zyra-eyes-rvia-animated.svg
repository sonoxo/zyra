<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ZYRA Eyes RVIA animated perception-to-action runtime</title>
  <desc id="desc">Animated visual showing screen perception converted to binary, routed through RVIA, policy-gated by ZYRA, and transformed into an approved action with audit evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05030c"/><stop offset="0.48" stop-color="#120626"/><stop offset="1" stop-color="#02151b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d6bff"/><stop offset="0.5" stop-color="#ff4fd8"/><stop offset="1" stop-color="#2df6ff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.2" stop-color="#2df6ff"/><stop offset="0.55" stop-color="#8d6bff" stop-opacity="0.72"/><stop offset="1" stop-color="#8d6bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2df6ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2df6ff"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="810" cy="440" r="290" fill="#8d6bff" opacity="0.08" filter="url(#soft)">
    <animate attributeName="r" values="250;330;250" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="440" r="190" fill="#2df6ff" opacity="0.06" filter="url(#soft)">
    <animate attributeName="opacity" values="0.03;0.12;0.03" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <text x="800" y="74" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="8" fill="#2df6ff">ZYRA // EYES // RVIA</text>
  <text x="800" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#fff">PERCEPTION → REASONING → GOVERNANCE → ACTION</text>
  <text x="800" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#a7b7c8">VA BINARY VISION • RVIA ORCHESTRATION • US-CZ POLICY • EVIDENCE-FIRST EXECUTION</text>

  <!-- Left perception chamber -->
  <g transform="translate(70 220)">
    <rect width="430" height="470" rx="26" fill="#07111b" stroke="#2df6ff" stroke-opacity="0.42" stroke-width="2"/>
    <text x="28" y="46" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#2df6ff">01 // SEE</text>
    <text x="28" y="74" font-family="Inter, Arial" font-size="15" fill="#8ca0b3">screen photons → grayscale → signal</text>

    <g transform="translate(28 106)">
      <rect width="374" height="230" rx="18" fill="#03070c" stroke="#8d6bff" stroke-opacity="0.4"/>
      <g opacity="0.9">
        <circle cx="255" cy="82" r="62" fill="url(#core)" filter="url(#glow)">
          <animate attributeName="cx" values="255;290;230;255" dur="5.6s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="82;122;70;82" dur="4.8s" repeatCount="indefinite"/>
        </circle>
      </g>
      <rect x="2" y="2" width="370" height="6" fill="url(#neon)" opacity="0.85">
        <animate attributeName="y" values="6;220;6" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="16" y="210" font-family="ui-monospace, monospace" font-size="12" fill="#6e8599">LIVE FRAME // LOCAL SENSOR</text>
    </g>

    <g transform="translate(28 360)" font-family="ui-monospace, monospace" font-size="17" fill="#9cff57">
      <text x="0" y="0">0011000011110010</text><text x="0" y="26">0011100111110010</text><text x="0" y="52">0000011111000000</text><text x="0" y="78">1100011111000011</text>
      <rect x="0" y="-19" width="310" height="22" fill="#2df6ff" opacity="0.08">
        <animate attributeName="y" values="-19;61;-19" dur="2.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="28" y="454" font-family="ui-monospace, monospace" font-size="13" fill="#ff4fd8">VA_BINARY_STREAM = ACTIVE</text>
  </g>

  <!-- Core RVIA -->
  <g transform="translate(560 230)">
    <circle cx="240" cy="225" r="174" fill="none" stroke="#8d6bff" stroke-opacity="0.32" stroke-width="2" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" from="0 240 225" to="360 240 225" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="225" r="132" fill="#0d0718" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="240" cy="225" r="88" fill="url(#core)" opacity="0.55">
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="240" y="205" text-anchor="middle" font-family="Inter, Arial" font-size="32" font-weight="900" fill="#fff">RVIA</text>
    <text x="240" y="236" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#2df6ff">UNIFIED ORCHESTRATION</text>
    <text x="240" y="260" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#a7b7c8">REASON • ROUTE • PLAN</text>

    <g font-family="ui-monospace, monospace" font-size="12" text-anchor="middle">
      <g transform="translate(240 14)"><circle r="34" fill="#130a24" stroke="#ff4fd8"/><text y="4" fill="#fff">LLM</text><circle r="42" fill="none" stroke="#ff4fd8" opacity="0.25"><animate attributeName="r" values="36;52;36" dur="2.8s" repeatCount="indefinite"/></circle></g>
      <g transform="translate(56 225)"><circle r="34" fill="#071a20" stroke="#2df6ff"/><text y="4" fill="#fff">ZYRA</text><circle r="42" fill="none" stroke="#2df6ff" opacity="0.25"><animate attributeName="r" values="36;52;36" dur="3.3s" repeatCount="indefinite"/></circle></g>
      <g transform="translate(424 225)"><circle r="34" fill="#17101e" stroke="#8d6bff"/><text y="4" fill="#fff">XUNIA</text><circle r="42" fill="none" stroke="#8d6bff" opacity="0.25"><animate attributeName="r" values="36;52;36" dur="3s" repeatCount="indefinite"/></circle></g>
      <g transform="translate(240 436)"><circle r="34" fill="#081a13" stroke="#9cff57"/><text y="4" fill="#fff">NXYZ</text><circle r="42" fill="none" stroke="#9cff57" opacity="0.25"><animate attributeName="r" values="36;52;36" dur="3.6s" repeatCount="indefinite"/></circle></g>
    </g>

    <g stroke="url(#neon)" stroke-width="2" stroke-opacity="0.65" fill="none" stroke-dasharray="7 9">
      <path d="M240 50V93"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
      <path d="M92 225H107"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
      <path d="M373 225H388"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
      <path d="M240 357V402"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- Right governance chamber -->
  <g transform="translate(1110 220)">
    <rect width="420" height="470" rx="26" fill="#0b0a14" stroke="#ff4fd8" stroke-opacity="0.38" stroke-width="2"/>
    <text x="28" y="46" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#ff4fd8">03 // GOVERN + ACT</text>
    <text x="28" y="74" font-family="Inter, Arial" font-size="15" fill="#a993b8">policy → approval → action → evidence</text>

    <g transform="translate(28 110)">
      <rect width="364" height="68" rx="14" fill="#081813" stroke="#9cff57" stroke-opacity="0.5"/>
      <circle cx="34" cy="34" r="10" fill="#9cff57" filter="url(#glow)"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="60" y="30" font-family="ui-monospace, monospace" font-size="13" fill="#9cff57">US-CZ POLICY GATE</text>
      <text x="60" y="49" font-family="ui-monospace, monospace" font-size="12" fill="#d9e3ea">AUTHORIZATION: REQUIRED</text>
    </g>

    <g transform="translate(28 198)">
      <rect width="364" height="68" rx="14" fill="#160b17" stroke="#ff4fd8" stroke-opacity="0.45"/>
      <text x="22" y="28" font-family="ui-monospace, monospace" font-size="13" fill="#ff4fd8">HUMAN APPROVAL</text>
      <text x="22" y="48" font-family="ui-monospace, monospace" font-size="12" fill="#d9e3ea">ONE-TIME EXACT ACTION TOKEN</text>
      <rect x="292" y="19" width="48" height="30" rx="15" fill="#2df6ff" opacity="0.2"/>
      <circle cx="324" cy="34" r="11" fill="#2df6ff" filter="url(#glow)"><animate attributeName="cx" values="305;326;305" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>

    <g transform="translate(28 286)">
      <rect width="364" height="68" rx="14" fill="#09101a" stroke="#2df6ff" stroke-opacity="0.5"/>
      <text x="22" y="28" font-family="ui-monospace, monospace" font-size="13" fill="#2df6ff">ACTION VECTOR</text>
      <text x="22" y="50" font-family="ui-monospace, monospace" font-size="12" fill="#fff">MOVE(1422, 438)</text>
      <path d="M250 34H332" stroke="#2df6ff" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="0.8s" repeatCount="indefinite"/></path>
    </g>

    <g transform="translate(28 374)">
      <rect width="364" height="54" rx="14" fill="#0e1510" stroke="#9cff57" stroke-opacity="0.45"/>
      <text x="22" y="23" font-family="ui-monospace, monospace" font-size="12" fill="#9cff57">EVIDENCE HASH</text>
      <text x="22" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#a7b7c8">7A4F...A91C // VERIFIED POSTCONDITION</text>
    </g>
  </g>

  <!-- Animated bridges -->
  <g fill="none" stroke="#2df6ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 18" opacity="0.8">
    <path d="M500 455C540 455 545 455 575 455"><animate attributeName="stroke-dashoffset" from="0" to="-60" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M1040 455C1070 455 1080 455 1110 455"><animate attributeName="stroke-dashoffset" from="0" to="-60" dur="1.1s" repeatCount="indefinite"/></path>
  </g>

  <g transform="translate(150 746)">
    <rect width="1300" height="82" rx="20" fill="#070b12" stroke="url(#neon)" stroke-opacity="0.45"/>
    <text x="650" y="31" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3" fill="#a7b7c8">REAL-TIME OPERATING LOOP</text>
    <text x="650" y="58" text-anchor="middle" font-family="Inter, Arial" font-size="19" font-weight="700" fill="#fff">OBSERVE  →  ENCODE  →  REASON  →  AUTHORIZE  →  ACT  →  VERIFY  →  REMEMBER</text>
  </g>

  <text x="800" y="870" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#8ca0b3">SIMULATION FIRST • LOCAL OWNER CONTROL • PRIVACY-PRESERVING AUDIT • NO AUTHORITY BYPASS</text>
</svg>
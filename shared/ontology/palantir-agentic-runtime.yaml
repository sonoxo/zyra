ontology:
  id: zyra:palantir-agentic-runtime
  version: 1.1.0
  updatedAt: 2026-09-03
  purpose: >-
    Govern how XUNIA, ZYRA, GPT-Doug-LLM, and RVIA consume Palantir Foundry/AIP/Apollo
    capabilities through OSDK, MCP, AI FDE, AIP Logic, and Automate while preserving
    authorization, provenance, audit, human-review boundaries, and evidence-backed
    public intelligence ingestion through The Black House.

  controllingReferences:
    - https://www.palantir.com/docs/foundry/platform-overview
    - https://www.palantir.com/docs/foundry/dev-toolchain/overview
    - https://www.palantir.com/docs/foundry/ontology/overview
    - https://www.palantir.com/docs/foundry/ontology-sdk/overview
    - https://www.palantir.com/docs/foundry/ai-fde/overview
    - https://www.palantir.com/docs/foundry/automate
    - https://www.palantir.com/docs/foundry/logic/aip-logic-integration-automate
    - https://investors.palantir.com/files/Palantir%20-%20Q1%202026%20Business%20Update.pdf

  supplementalReferences:
    - id: youtube:wdyKBzBxM6w
      uri: https://www.youtube.com/watch?v=wdyKBzBxM6w
      evidenceClass: PUBLIC_REFERENCE
      suppliedAt: 2026-09-02
      suppliedBy: OWNER
      verificationState: METADATA_PENDING
      promotionPolicy: VERIFY_AGAINST_CONTROLLING_DOCS
    - id: youtube:3O8isI3GJXU
      uri: https://www.youtube.com/watch?v=3O8isI3GJXU
      title: AIPCon 9 March 2026 | Livestream
      publisher: Palantir
      evidenceClass: PUBLIC_REFERENCE
      suppliedAt: 2026-09-03
      suppliedBy: OWNER
      verificationState: SOURCE_METADATA_VERIFIED
      intelligenceBrief: .black-house/intel/aipcon-9-2026-03-09.json
      promotionPolicy: RECONCILE_WITH_PALANTIR_FIRST_PARTY_SOURCES

  platformLayers:
    experienceAndAgents:
      - XUNIA
      - GPT_DOUG_LLM
      - RVIA_REPOSITORY_INTELLIGENCE
    governedOperationalGraph:
      - ZYRA
      - PALANTIR_FOUNDRY_ONTOLOGY
      - BLACK_HOUSE_INTELLIGENCE
    aiAndLogic:
      - PALANTIR_AIP
      - AIP_LOGIC
      - AI_FDE
    developerAccess:
      - OSDK
      - ONTOLOGY_MCP
      - PALANTIR_MCP
    businessAutomation:
      - AUTOMATE
    continuousDelivery:
      - PALANTIR_APOLLO

  integrationPatterns:
    OSDK:
      producer: PALANTIR_FOUNDRY
      consumers: [XUNIA, ZYRA]
      purpose: Permission-scoped object, link, action, function, and Logic access.
      writes: EXPLICIT_ACTION
    ONTOLOGY_MCP:
      producer: PALANTIR_FOUNDRY
      consumers: [GPT_DOUG_LLM, XUNIA]
      purpose: Expose selected Ontology resources as MCP tools to approved external agents.
      writes: EXPLICIT_ACTION
    PALANTIR_MCP:
      producer: PALANTIR_FOUNDRY
      consumers: [GPT_DOUG_LLM]
      purpose: Provide Palantir platform context and tools to approved AI development workflows.
      writes: EXPLICIT_ACTION
    AI_FDE:
      producer: PALANTIR_AIP
      consumers: [XUNIA]
      purpose: Convert natural-language engineering intent into governed Foundry operations.
      writes: STAGED_REVIEW
    AIP_LOGIC:
      producer: PALANTIR_AIP
      consumers: [ZYRA]
      purpose: Execute LLM-assisted functions over governed Ontology context.
      writes: STAGED_REVIEW
    AUTOMATE:
      producer: PALANTIR_FOUNDRY
      consumers: [ZYRA, XUNIA]
      purpose: Trigger Actions, Logic, functions, and notifications from time or Ontology state.
      writes: STAGED_REVIEW
    APOLLO:
      producer: PALANTIR_APOLLO
      consumers: [RVIA_REPOSITORY_INTELLIGENCE, ZYRA]
      purpose: Ingest deployment and runtime state as evidence-bearing operational signals.
      writes: READ_ONLY
    BLACK_HOUSE_INTELLIGENCE:
      producer: PUBLIC_AND_FIRST_PARTY_SOURCES
      consumers: [GPT_DOUG_LLM, ZYRA, NXYZ]
      purpose: Normalize public AIP intelligence into provenance-bearing briefs that can inform ontology design and missions without implying authorization.
      writes: EVIDENCE_ONLY

  operationalSignals:
    AIPCON_9_2026:
      source: youtube:3O8isI3GJXU
      brief: .black-house/intel/aipcon-9-2026-03-09.json
      themes:
        - AGENTIC_ENTERPRISE_TRANSFORMATION
        - GOVERNED_OPERATIONAL_EXECUTION
        - ERP_AND_CLOUD_MIGRATION
        - VALIDATION_AUTOMATION
        - FLEET_AND_SUPPLY_CHAIN_OPERATIONS
      designRule: MEASURABLE_OUTCOMES_OVER_GENERIC_MODEL_CLAIMS

  classes:
    - AgentToolBinding
    - AutomationDefinition
    - AutomationTrigger
    - AutomationEffect
    - StagedWrite
    - HumanReviewGate
    - PublicReference
    - PlatformRuntimeSignal
    - AuthorizationState
    - AuditEvent
    - IntelligenceBrief
    - IntelligenceSignal

  relations:
    exposesTool:
      domain: AgentToolBinding
      range: PublicReference
    triggers:
      domain: AutomationTrigger
      range: AutomationDefinition
    producesEffect:
      domain: AutomationDefinition
      range: AutomationEffect
    stagesWrite:
      domain: AutomationEffect
      range: StagedWrite
    requiresReview:
      domain: StagedWrite
      range: HumanReviewGate
    requiresAuthorization:
      domain: AgentToolBinding
      range: AuthorizationState
    emitsAudit:
      domain: AutomationDefinition
      range: AuditEvent
    derivedFrom:
      domain: IntelligenceBrief
      range: PublicReference

  invariants:
    - MCP exposure does not imply write authorization.
    - AI FDE does not bypass Foundry permissions or review requirements.
    - Ontology-changing workflows use Actions or staged writes when approval is required.
    - Automate effects inherit object-level authorization and audit constraints.
    - Public video or community references remain supplemental until reconciled with controlling documentation.
    - Public intelligence may inform design and analysis but never grants external platform authorization.
    - Claims promoted into operational intelligence require provenance and an explicit verification state.
    - No secret, token, credential, or enrollment-specific identifier is committed to source control.

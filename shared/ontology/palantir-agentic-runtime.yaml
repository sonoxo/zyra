      uri: https://www.youtube.com/watch?v=wdyKBzBxM6w
      evidenceClass: PUBLIC_REFERENCE
      suppliedAt: 2026-09-02
      suppliedBy: OWNER
      verificationState: METADATA_PENDING
      promotionPolicy: VERIFY_AGAINST_CONTROLLING_DOCS
    - id: youtube:3O8isI3GJXU
      uri: https://www.youtube.com/watch?v=3O8isI3GJXU
      title: AIPCon 9 March 2026 | Livestream
      publisher: Palantir
      evidenceClass: PUBLIC_REFERENCE
      suppliedAt: 2026-09-03
      suppliedBy: OWNER
      verificationState: SOURCE_METADATA_VERIFIED
      intelligenceBrief: .black-house/intel/aipcon-9-2026-03-09.json
      promotionPolicy: RECONCILE_WITH_PALANTIR_FIRST_PARTY_SOURCES
    - id: youtube:9eUUeTC6wnY
      uri: https://www.youtube.com/watch?v=9eUUeTC6wnY
      title: EXCLUSIVE Interview w/ Top Palantir Architect
      publisher: Hans Nelson
      guest: Chad Wahlquist
      evidenceClass: PUBLIC_INTERVIEW_REFERENCE
      suppliedAt: 2026-09-03
      suppliedBy: OWNER
      verificationState: SOURCE_SUMMARY_AND_CHAPTERS_VERIFIED
      intelligenceBrief: .black-house/intel/palantir-sovereign-ai-harness-2026-08-19.json
      promotionPolicy: CORROBORATE_PRODUCT_CLAIMS_WITH_PALANTIR_FIRST_PARTY_DOCS

  platformLayers:
    experienceAndAgents:
      - XUNIA
      - GPT_DOUG_LLM
      - RVIA_REPOSITORY_INTELLIGENCE
    governedOperationalGraph:
      - ZYRA
      - PALANTIR_FOUNDRY_ONTOLOGY
      - BLACK_HOUSE_INTELLIGENCE
      - BLACK_HOUSE_SOVEREIGN_AI_HARNESS
    aiAndLogic:
      - PALANTIR_AIP
      - AIP_LOGIC
      - AI_FDE
      - AIP_EVALS
      - AIP_EVOLVE
    developerAccess:
      - OSDK
      - ONTOLOGY_MCP
      - PALANTIR_MCP
    businessAutomation:
      - AUTOMATE
    continuousDelivery:
      - PALANTIR_APOLLO

  integrationPatterns:
    OSDK:
      producer: PALANTIR_FOUNDRY
      consumers: [XUNIA, ZYRA]
      purpose: Permission-scoped object, link, action, function, and Logic access.
      writes: EXPLICIT_ACTION
    ONTOLOGY_MCP:
      producer: PALANTIR_FOUNDRY
      consumers: [GPT_DOUG_LLM, XUNIA]
      purpose: Expose selected Ontology resources as MCP tools to approved external agents.
      writes: EXPLICIT_ACTION
    PALANTIR_MCP:
      producer: PALANTIR_FOUNDRY
      consumers: [GPT_DOUG_LLM]
      purpose: Provide Palantir platform context and tools to approved AI development workflows.
      writes: EXPLICIT_ACTION
    AI_FDE:
      producer: PALANTIR_AIP
      consumers: [XUNIA]
      purpose: Convert natural-language engineering intent into governed Foundry operations.
      writes: STAGED_REVIEW
    AIP_LOGIC:
      producer: PALANTIR_AIP
      consumers: [ZYRA]
      purpose: Execute LLM-assisted functions over governed Ontology context.
      writes: STAGED_REVIEW
    AIP_EVALS:
      producer: PALANTIR_AIP
      consumers: [ZYRA, XUNIA, GPT_DOUG_LLM]
      purpose: Evaluate workflow-specific target functions with representative cases, criteria, repeated runs, and baseline comparisons before production promotion.
      writes: EVIDENCE_ONLY
    AIP_EVOLVE:
      producer: PALANTIR_AIP
      consumers: [XUNIA, GPT_DOUG_LLM]
      purpose: Coordinate bounded candidate improvements under explicit optimization goals, constraints, validation strategies, and review-before-merge semantics.
      writes: STAGED_REVIEW
    AUTOMATE:
      producer: PALANTIR_FOUNDRY
      consumers: [ZYRA, XUNIA]
      purpose: Trigger Actions, Logic, functions, and notifications from time or Ontology state.
      writes: STAGED_REVIEW
    APOLLO:
      producer: PALANTIR_APOLLO
      consumers: [RVIA_REPOSITORY_INTELLIGENCE, ZYRA]
      purpose: Ingest deployment and runtime state as evidence-bearing operational signals.
      writes: READ_ONLY
    BLACK_HOUSE_INTELLIGENCE:
      producer: PUBLIC_AND_FIRST_PARTY_SOURCES
      consumers: [GPT_DOUG_LLM, ZYRA, NXYZ]
      purpose: Normalize public AIP intelligence into provenance-bearing briefs that can inform ontology design and missions without implying authorization.
      writes: EVIDENCE_ONLY
    BLACK_HOUSE_SOVEREIGN_AI_HARNESS:
      producer: BLACK_HOUSE_KNOWLEDGE_BASE
      consumers: [GPT_DOUG_LLM, ZYRA, XUNIA, NXYZ]
      purpose: Keep data, logic, actions, security, evaluations, traces, feedback, and promotion rights organization-owned while models and providers remain replaceable adapters.
      writes: STAGED_REVIEW
      ontology: shared/ontology/black-house-sovereign-ai-harness.yaml

  operationalSignals:
    AIPCON_9_2026:
      source: youtube:3O8isI3GJXU
      brief: .black-house/intel/aipcon-9-2026-03-09.json
      themes:
        - AGENTIC_ENTERPRISE_TRANSFORMATION
        - GOVERNED_OPERATIONAL_EXECUTION
        - ERP_AND_CLOUD_MIGRATION
        - VALIDATION_AUTOMATION
        - FLEET_AND_SUPPLY_CHAIN_OPERATIONS
      designRule: MEASURABLE_OUTCOMES_OVER_GENERIC_MODEL_CLAIMS
    SOVEREIGN_AI_HARNESS_2026:
      source: youtube:9eUUeTC6wnY
      brief: .black-house/intel/palantir-sovereign-ai-harness-2026-08-19.json
      themes:
        - AI_SOVEREIGNTY_AND_DECISION_RIGHTS
        - MODEL_PORTABILITY
        - DATA_LOGIC_ACTIONS_SECURITY_HARNESS
        - WORKFLOW_SPECIFIC_EVALS
        - POST_TRAINING_FEEDBACK_FLYWHEEL
        - PRODUCTION_RELIABILITY
        - HUMAN_AUGMENTATION
      designRules:
        - OWN_THE_HARNESS_NOT_THE_MODEL
        - WORKFLOW_EVALS_OVER_GENERIC_BENCHMARKS
        - BASELINE_VS_CANDIDATE_BEFORE_PROMOTION
        - SENSITIVE_DATA_BOUNDARIES_BEFORE_PROVIDER_EGRESS
        - HUMAN_REVIEW_FOR_CONSEQUENTIAL_PROMOTION

  classes:
    - AgentToolBinding
    - AutomationDefinition
    - AutomationTrigger
    - AutomationEffect
    - StagedWrite
    - HumanReviewGate
    - PublicReference
    - PlatformRuntimeSignal
    - AuthorizationState
    - AuditEvent
    - IntelligenceBrief
    - IntelligenceSignal
    - SovereigntyPolicy
    - BusinessHarness
    - HarnessPlane
    - ModelAdapter
    - ModelCandidate
    - EvaluationSuite
    - EvaluationRun
    - ExecutionTrace
    - FeedbackSignal
    - OutcomeMetric
    - RegressionGate
    - SensitiveDataPolicy
    - OptimizationProposal
    - BaselineVersion
    - CandidateVersion
    - PromotionDecision
    - HumanDecision

  relations:
    exposesTool:
      domain: AgentToolBinding
      range: PublicReference
    triggers:
      domain: AutomationTrigger
      range: AutomationDefinition
    producesEffect:
      domain: AutomationDefinition
      range: AutomationEffect
    stagesWrite:
      domain: AutomationEffect
      range: StagedWrite
    requiresReview:
      domain: StagedWrite
      range: HumanReviewGate
    requiresAuthorization:
      domain: AgentToolBinding
      range: AuthorizationState
    emitsAudit:
      domain: AutomationDefinition
      range: AuditEvent
    derivedFrom:
      domain: IntelligenceBrief
      range: PublicReference
    bindsModel:
      domain: BusinessHarness
      range: ModelAdapter
    evaluatedBy:
      domain: ModelCandidate
      range: EvaluationSuite
    producesRun:
      domain: EvaluationSuite
      range: EvaluationRun
    emitsTrace:
      domain: EvaluationRun
      range: ExecutionTrace
    producesFeedback:
      domain: ExecutionTrace
      range: FeedbackSignal
    proposesCandidate:
      domain: OptimizationProposal
      range: CandidateVersion
    comparesBaseline:
      domain: OptimizationProposal
      range: BaselineVersion
    decidedBy:
      domain: PromotionDecision
      range: HumanDecision

  sovereignHarnessPolicy:
    organizationOwned:
      - ONTOLOGY
      - DATA_CONTRACTS
      - BUSINESS_LOGIC
      - ACTION_SEMANTICS
      - SECURITY_POLICY
      - EVALUATION_CRITERIA
      - REPRESENTATIVE_TEST_CASES
      - TRACES
      - FEEDBACK
      - EVIDENCE
      - PROMOTION_DECISIONS
    replaceable:
      - MODEL
      - MODEL_PROVIDER
      - INFERENCE_ENDPOINT
      - PROMPT_IMPLEMENTATION
      - OPTIMIZATION_STRATEGY
    promotionRequires:
      - REPRESENTATIVE_WORKFLOW_EVALUATION
      - BASELINE_COMPARISON
      - REGRESSION_CHECK
      - SENSITIVE_DATA_POLICY_CHECK
      - SUPPORTING_EVIDENCE
      - HUMAN_REVIEW_IF_CONSEQUENTIAL

  invariants:
    - MCP exposure does not imply write authorization.
    - AI FDE does not bypass Foundry permissions or review requirements.
    - Ontology-changing workflows use Actions or staged writes when approval is required.
    - Automate effects inherit object-level authorization and audit constraints.
    - Public video or community references remain supplemental until reconciled with controlling documentation.
    - Public intelligence may inform design and analysis but never grants external platform authorization.
    - Claims promoted into operational intelligence require provenance and an explicit verification state.
    - The model is a replaceable adapter and never becomes the source of organizational authority.
    - Provider or model changes cannot silently alter authorization, business logic, or action semantics.
    - Generic benchmark scores cannot by themselves authorize production promotion.
    - Candidate changes must be compared against a preserved baseline with workflow-specific evaluation evidence.
    - Sensitive data must remain inside authorized context and provider boundaries.
    - Human augmentation is the default success model; consequential promotion remains human-gated.
    - No secret, token, credential, or enrollment-specific identifier is committed to source control.

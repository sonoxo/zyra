ontology:
  id: zyra:black-house-continuous-validation
  version: 1.1.0
  updatedAt: 2026-09-04
  purpose: >-
    Provide a zero-paid-API validation and closed-loop improvement system for migration and operational
    workflows. The loop compares source and target records, records deterministic evidence, proposes a
    reviewable correction when quality is below policy, re-validates the candidate, preserves only the
    better result, and requires human review before consequential promotion.

  sourceIntelligence:
    primaryBrief: .black-house/intel/aipcon-9-2026-03-09.json
    designPriority: CONTINUOUS_VALIDATION_WITH_MEASURABLE_OUTCOMES_AND_ITERATIVE_IMPROVEMENT

  classes:
    - ValidationRun
    - ValidationPolicy
    - SourceSnapshot
    - TargetSnapshot
    - ValidationMetric
    - ValidationDelta
    - ImprovementProposal
    - ImprovementCandidate
    - PreservedResult
    - EvidenceArtifact
    - HumanReviewGate
    - PromotionDecision

  relations:
    validates:
      domain: ValidationRun
      range: TargetSnapshot
    comparesAgainst:
      domain: ValidationRun
      range: SourceSnapshot
    governedBy:
      domain: ValidationRun
      range: ValidationPolicy
    proposes:
      domain: ValidationRun
      range: ImprovementProposal
    producesCandidate:
      domain: ImprovementProposal
      range: ImprovementCandidate
    preserves:
      domain: ValidationRun
      range: PreservedResult
    produces:
      domain: ValidationRun
      range: EvidenceArtifact
    reports:
      domain: ValidationRun
      range: ValidationMetric
    detects:
      domain: ValidationRun
      range: ValidationDelta
    requiresReview:
      domain: PromotionDecision
      range: HumanReviewGate

  workflow:
    - SNAPSHOT_SOURCE
    - SNAPSHOT_TARGET
    - HASH_INPUTS
    - COMPARE_BY_STABLE_KEY
    - CALCULATE_VALIDATION_ACCURACY
    - RECORD_CHANGED_MISSING_UNEXPECTED
    - APPLY_THRESHOLD_POLICY
    - IF_DEGRADED_PROPOSE_SOURCE_CANONICAL_RECONCILIATION
    - REVALIDATE_CANDIDATE
    - COMPARE_BEFORE_AND_AFTER
    - PRESERVE_ONLY_BETTER_RESULT
    - EMIT_EVIDENCE
    - REQUIRE_HUMAN_REVIEW_FOR_CONSEQUENTIAL_PROMOTION

  runtime:
    validator: scripts/black-house/continuous-validator.mjs
    improver: scripts/black-house/closed-loop-improver.mjs
    paidApiRequired: false
    externalServiceRequired: false
    externalModelRequired: false
    supportedInputs: [JSON, CSV]
    defaultKey: id
    defaultThresholdPct: 99
    validationEvidencePath: .black-house/evidence/continuous-validation.json
    improvementEvidencePath: .black-house/evidence/closed-loop-improvement.json
    candidatePath: .black-house/evidence/improved-candidate.json
    ciWorkflow: .github/workflows/black-house-continuous-validation.yml

  invariants:
    - Validation evidence must contain hashes for source and target input material.
    - Improvement evidence must contain the before score, candidate score, preserved score, and candidate hash.
    - The original target is never overwritten by the closed-loop engine.
    - Only a higher-quality candidate may be preserved by the engine.
    - A passing or improved validation does not itself authorize deployment or promotion.
    - Consequential promotion requires an explicit human review gate.
    - No external API, model subscription, cloud account, or paid inference service is required.

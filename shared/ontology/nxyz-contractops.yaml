ontology:
  id: zyra:nxyz-contractops
  version: 0.1.0
  name: NXYZ ContractOps
  purpose: Evidence-backed federal readiness, opportunity qualification, proposal preparation, and human-reviewed submission readiness.

classes:
  Organization:
    properties: [organizationId, name]
  FederalRegistration:
    properties: [registrationId, kind, state, identifier, source, verifiedAt, notes]
  Opportunity:
    properties: [opportunityId, title, agency, solicitationNumber, sourceUrl, deadline, naics, psc, setAside, state, capturedAt]
  Requirement:
    properties: [requirementId, text, category, state, mandatory]
  Capability:
    properties: [capabilityId, name, domain, summary]
  CredentialEvidence:
    properties: [evidenceId, title, issuer, evidenceState, verificationReference, authorizationGrant]
  RepositoryEvidence:
    properties: [evidenceId, title, repositoryPath, commitSha, artifactHash]
  BidAssessment:
    properties: [assessmentId, technicalFit, evidenceCoverage, registrationReadiness, deadlineRisk, overallFit, recommendation]
  Proposal:
    properties: [proposalId, status, reviewDecision, updatedAt]
  ProposalSection:
    properties: [sectionId, title, status]
  ReviewDecision:
    properties: [reviewId, decision, reviewer, reviewedAt, notes]
  AuditEvent:
    properties: [eventId, actor, action, target, timestamp, provenance]

relations:
  hasRegistration: { domain: Organization, range: FederalRegistration }
  hasCapability: { domain: Organization, range: Capability }
  capabilitySupportedByCredential: { domain: Capability, range: CredentialEvidence }
  capabilitySupportedByRepositoryEvidence: { domain: Capability, range: RepositoryEvidence }
  opportunityHasRequirement: { domain: Opportunity, range: Requirement }
  requirementMatchedByCapability: { domain: Requirement, range: Capability }
  opportunityHasAssessment: { domain: Opportunity, range: BidAssessment }
  proposalForOpportunity: { domain: Proposal, range: Opportunity }
  proposalHasSection: { domain: Proposal, range: ProposalSection }
  proposalHasReview: { domain: Proposal, range: ReviewDecision }
  emitsAudit: { domain: Proposal, range: AuditEvent }

actions:
  captureOpportunity:
    mutating: true
    approval: not_required
  updateRegistrationStatus:
    mutating: true
    approval: required_for_active_state
  scoreOpportunity:
    mutating: false
    approval: not_required
  attachEvidence:
    mutating: true
    approval: not_required
  buildProposalDraft:
    mutating: true
    approval: not_required
  markSubmissionReady:
    mutating: true
    approval: human_required
  recordSubmission:
    mutating: true
    approval: human_required

rules:
  - Never invent UEI, CAGE, SAM, or other government registration identifiers.
  - A registration may be ACTIVE only when a verification source is recorded.
  - ZYRA/RVIA repository badges are evidence of repository work, not government authorization or security clearance.
  - Training credentials may support capability claims but never grant platform or government permissions by themselves.
  - Every proposal claim should resolve to credential, repository, product, or other traceable evidence.
  - No government portal submission is performed automatically; final submission remains a human-reviewed external action.
  - Secrets, access tokens, passwords, and restricted data must not be stored in this ontology contract.
